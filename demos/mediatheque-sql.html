      PRAGMA foreign_keys = ON;
      CREATE TABLE categorie (
        id_categorie INTEGER PRIMARY KEY AUTOINCREMENT,
        libelle VARCHAR(50) NOT NULL
      );
      CREATE TABLE livre (
        id_livre INTEGER PRIMARY KEY AUTOINCREMENT,
        isbn VARCHAR(13) NOT NULL,
        titre VARCHAR(150) NOT NULL,
        auteur VARCHAR(100) NOT NULL,
        annee_parution INT NOT NULL,
        nb_pages INT NULL,
        id_categorie INT NOT NULL,
        FOREIGN KEY (id_categorie) REFERENCES categorie (id_categorie)
      );
      CREATE TABLE adherent (
        id_adherent INTEGER PRIMARY KEY AUTOINCREMENT,
        nom VARCHAR(50) NOT NULL,
        prenom VARCHAR(50) NOT NULL,
        email VARCHAR(100) NULL,
        ville VARCHAR(50) NOT NULL,
        date_naissance DATE NOT NULL,
        date_inscription DATE NOT NULL
      );
      CREATE TABLE emprunt (
        id_livre INT NOT NULL,
        id_adherent INT NOT NULL,
        date_emprunt DATE NOT NULL,
        date_retour_prevue DATE NOT NULL,
        date_retour DATE NULL,
        PRIMARY KEY (id_livre, id_adherent, date_emprunt),
        FOREIGN KEY (id_livre) REFERENCES livre (id_livre),
        FOREIGN KEY (id_adherent) REFERENCES adherent (id_adherent)
      );
    `;

    const PRESETS = [
      {
        label: 'Catégories (GROUP BY + HAVING)',
        sql: `-- Catégories ayant au moins 4 livres, avec nombre et moyenne de pages\nSELECT c.libelle, COUNT(l.id_livre) AS nb_livres, ROUND(AVG(l.nb_pages)) AS moyenne_pages\nFROM categorie c\nINNER JOIN livre l ON c.id_categorie = l.id_categorie\nGROUP BY c.libelle\nHAVING COUNT(l.id_livre) >= 4;`
      },
      {
        label: 'Retards au 02/11/2026 (DATEDIFF)',
        sql: `-- Emprunts en retard au 2 novembre 2026 avec jours de retard\nSELECT a.nom, a.prenom, l.titre, e.date_retour_prevue,\n       DATEDIFF('2026-11-02', e.date_retour_prevue) AS jours_retard\nFROM emprunt e\nINNER JOIN adherent a ON e.id_adherent = a.id_adherent\nINNER JOIN livre l ON e.id_livre = l.id_livre\nWHERE e.date_retour IS NULL\n  AND e.date_retour_prevue < '2026-11-02';`
      },
      {
        label: 'Top emprunteurs (COUNT)',
        sql: `-- Nombre d'emprunts par adhérent, du plus grand au plus petit\nSELECT a.nom, a.prenom, a.ville, COUNT(*) AS nb_emprunts\nFROM adherent a\nINNER JOIN emprunt e ON a.id_adherent = e.id_adherent\nGROUP BY a.id_adherent, a.nom, a.prenom, a.ville\nORDER BY nb_emprunts DESC;`
      },
      {
        label: 'Livres jamais empruntés (LEFT JOIN)',
        sql: `-- Livres qui n'ont jamais été empruntés avec leur catégorie\nSELECT l.titre, l.auteur, c.libelle\nFROM livre l\nLEFT JOIN emprunt e ON l.id_livre = e.id_livre\nINNER JOIN categorie c ON l.id_categorie = c.id_categorie\nWHERE e.id_livre IS NULL;`
      },
      {
        label: 'Adhérents sans emprunt (RIGHT JOIN)',
        sql: `-- Adhérents qui n'ont jamais emprunté de livre\nSELECT a.nom, a.prenom, a.ville\nFROM emprunt e\nRIGHT JOIN adherent a ON e.id_adherent = a.id_adherent\nWHERE e.id_adherent IS NULL;`
      }
    ];

    const presetsEl = document.getElementById('presets');
    const sqlInput = document.getElementById('sql-input');
    const runBtn = document.getElementById('run-btn');
    const statusEl = document.getElementById('status');
    const tableContainer = document.getElementById('table-container');

    let db = null;

    function isReadOnlySelect(sqlText) {
      // Supprime commentaires et chaînes pour vérifier qu'il n'y a que des requêtes SELECT/WITH
      const withoutComments = sqlText
        .replace(/\/\*[\s\S]*?\*\//g, ' ')
        .replace(/--.*$/gm, ' ');
      const withoutStrings = withoutComments.replace(/'(?:''|[^'])*'/g, "''");
      const statements = withoutStrings
        .split(';')
        .map((s) => s.trim())
        .filter(Boolean);

      if (statements.length !== 1) return false;
      const firstWord = statements[0].split(/\s+/)[0].toUpperCase();
      return firstWord === 'SELECT' || firstWord === 'WITH';
    }

    function executeQuery() {
      if (!db) return;
      const query = sqlInput.value.trim();
      if (!query) return;

      tableContainer.innerHTML = '';
      statusEl.className = 'status-msg';

      if (!isReadOnlySelect(query)) {
        statusEl.className = 'status-msg status-err';
        statusEl.textContent = 'Sécurité : cette démo est en lecture seule (une seule requête SELECT ou WITH autorisée).';
        return;
      }

      try {
        const res = db.exec(query);
        if (!res.length) {
          statusEl.textContent = 'Requête exécutée (0 ligne retournée).';
          return;
        }
        const first = res[0];
        statusEl.textContent = `${first.values.length} résultat(s) affiché(s).`;

        const table = document.createElement('table');
        const thead = document.createElement('thead');
        const headRow = document.createElement('tr');
        first.columns.forEach((col) => {
          const th = document.createElement('th');
          th.textContent = col;
          headRow.appendChild(th);
        });
        thead.appendChild(headRow);
        table.appendChild(thead);

        const tbody = document.createElement('tbody');
        first.values.forEach((row) => {
          const tr = document.createElement('tr');
          row.forEach((cell) => {
            const td = document.createElement('td');
            if (cell === null) {
              td.textContent = 'NULL';
              td.className = 'null-val';
            } else {
              td.textContent = cell;
            }
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        tableContainer.appendChild(table);
      } catch (err) {
        statusEl.className = 'status-msg status-err';
        statusEl.textContent = `Erreur SQL : ${err.message}`;
      }
    }

    PRESETS.forEach((preset, idx) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'preset-btn' + (idx === 0 ? ' active' : '');
      btn.textContent = preset.label;
      btn.addEventListener('click', () => {
        document.querySelectorAll('.preset-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        sqlInput.value = preset.sql;
        executeQuery();
      });
      presetsEl.appendChild(btn);
    });

    sqlInput.value = PRESETS[0].sql;

    runBtn.addEventListener('click', executeQuery);
    sqlInput.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        executeQuery();
      }
    });

    initSqlJs({
      locateFile: (file) => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${file}`
    }).then((SQL) => {
      db = new SQL.Database();
      // Compatibilité DATEDIFF pour les requêtes écrites sous MySQL/MariaDB
      db.create_function('DATEDIFF', (d1, d2) => {
        const ms = new Date(d1) - new Date(d2);
        return Math.round(ms / (1000 * 60 * 60 * 24));
      });
      db.run(SCHEMA_SQL);
      db.run(DATA_SQL);

      runBtn.disabled = false;
      runBtn.textContent = 'Exécuter SQL ▶';
      executeQuery();
    }).catch((err) => {
      statusEl.className = 'status-msg status-err';
      statusEl.textContent = `Impossible de charger le moteur SQLite WebAssembly : ${err.message}`;
    });
